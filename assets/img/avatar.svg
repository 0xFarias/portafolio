<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="Avatar ilustrado de Jose Luis Farias Valdez">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26262b"/><stop offset="1" stop-color="#111114"/></linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.35" r="0.6"><stop offset="0" stop-color="#ff634a" stop-opacity="0.45"/><stop offset="1" stop-color="#ff634a" stop-opacity="0"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c79a7a"/><stop offset="1" stop-color="#a87a5c"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff634a"/><stop offset="1" stop-color="#a8321f"/></linearGradient>
    <pattern id="agrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#d2d2d4" stroke-opacity="0.07"/></pattern>
  </defs>
  <rect width="480" height="600" fill="url(#abg)"/>
  <rect width="480" height="600" fill="url(#agrid)"/>
  <rect width="480" height="600" fill="url(#aglow)"/>
  <!-- cuello y torso -->
  <path d="M205 330h70v60c0 18-70 18-70 0z" fill="url(#skin)"/>
  <path d="M70 600c0-120 70-200 170-200s170 80 170 200z" fill="url(#shirt)"/>
  <path d="M200 402c12 30 68 30 80 0" fill="none" stroke="#5c1e12" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <!-- cabeza -->
  <ellipse cx="240" cy="250" rx="92" ry="108" fill="url(#skin)"/>
  <path d="M148 236c-6-78 38-122 96-122 60 0 100 40 94 116-12-34-40-58-94-58-52 0-82 28-96 64z" fill="#1c1a1f"/>
  <ellipse cx="148" cy="258" rx="12" ry="22" fill="#b3876a"/>
  <ellipse cx="332" cy="258" rx="12" ry="22" fill="#b3876a"/>
  <!-- rasgos -->
  <path d="M196 244c8-6 20-6 28 0M256 244c8-6 20-6 28 0" stroke="#1c1a1f" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="210" cy="262" r="6" fill="#1c1a1f"/>
  <circle cx="270" cy="262" r="6" fill="#1c1a1f"/>
  <path d="M240 270v26l-8 6" stroke="#8a5f44" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M212 318c16 14 40 14 56 0" stroke="#5a3526" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M170 300c10 52 44 70 70 70s60-18 70-70c-8 30-34 44-70 44s-62-14-70-44z" fill="#1c1a1f" opacity="0.35"/>
  <!-- detalles de marca -->
  <text x="40" y="70" font-family="Consolas, monospace" font-size="18" fill="#d2d2d4" letter-spacing="4">&lt;/&gt;</text>
  <circle cx="430" cy="120" r="4" fill="#ff8a75"/>
  <circle cx="60" cy="470" r="3" fill="#d2d2d4"/>
</svg>
